# open-xiaoai-next Hub 配置（唯一配置文件）
# 改这里不用改代码；Web 面板（Phase 4）就是读写这个文件。
# 房间名由语音认领写入（“你好小李，我在客厅”），不用手填。

# 服务端 KWS 边车（kws-sidecar）：唤醒词检测已移出音箱、放 NAS 端边车。
# Hub 把每设备解码后的 PCM 流发给边车，边车命中唤醒词后回 wake 事件，
# Hub 再走现有 250ms 仲裁 + 语音管线。
# 寻址（2026-11-17 统一）：Hub 与边车都走 host 网络（见 deploy/docker-compose.yml），
# Hub 没有 compose 域名解析能力，所以边车地址不用容器名 kws-sidecar，
# 一律用 127.0.0.1:10400；边车只暴露这一个端口，不需要 mDNS/组播发现。
# enabled=false（默认）时 Hub 不连边车，语音唤醒不可用；
# enabled=true 时 url 与 keywords 必填，缺配或配错地址启动即报错。
kws:
  enabled: true
  url: "ws://127.0.0.1:10400/v1/kws"
  keywords:
    - "你好小李"

# 默认唤醒词。换词 = 换 KWS 模型文件 + 改这里，不用重刷机。
wake_word: "你好小李"

# 多唤醒词路由：唤醒词 → Agent 名
wake_word_routes:
  "你好小李": hermes
  "你好龙虾": openclaw

# 已注册的设备（P2-27/P2-51：空 IP 占位已删——占位键与设备真实 ID
# 对不上，注册表里会留幽灵行；设备由 register 主动注册写入，
# 种子只保留带真实 IP 的条目，手工改也行）。
# IP 由设备注册时上报；room 由语音认领写入，未认领为空。
devices: {}

# 音乐文件夹，默认 /volume1/music；不存在时只警告，本地曲库兜底不可用
#（点歌仍走网易云直连，不阻塞启动）。
music_folder: /volume1/music

# Home Assistant：Token 走环境变量 HASS_TOKEN，不要写进文件。
# 2026-11-18 bai 定：HA 未配 TLS，用 ws（此前误写成 wss，握手直接失败）。
home_assistant:
  url: "ws://192.168.1.10:8123"
  # media_player 上报（HA 融合 b）：Hub 每 15 秒把注册表里的音箱
  # 报给 HA 做 media_player.open_xiaoai_* 实体（state/音量/当前曲，
  # 走 REST POST /api/states，与上面 WS 共用 HASS_TOKEN）。
  # 默认开；显式写 false 关闭。实体与控制范围见 docs/HA_MEDIA_PLAYER.md。
  # media_player_enabled: true

# 音源顺序（插件式）：primary 先找，找不到/出错落到 fallback。
# 只能填 netease（网易云直连）或 local（MPD 本地曲库）；fallback
# 为空表示不兜底。缺省 primary=netease、fallback=local。
music:
  primary: netease
  fallback: local

# 技能插件（示例是占位桩，不要当真服务用）：名字 + 触发词 + HTTP 端点。
# 语音含触发词（子串匹配）即 POST {"text": "...", "device_id": "..."}
# 给端点，端点回 {"reply": "..."} 或纯文本，Hub 经 TTS 播出；
# 技能调用失败/回空时落回 Agent。加新技能只加一条，不改代码。
# news 这个例子指向本机一个不存在的桩端口（什么都没监听），
# 只是演示配置形状；接真实技能时把 endpoint 改成真实内网地址。
# 注意：不要把 endpoint 指向 Intel Hub——技能端点只许内网地址，
# 且新闻类技能应由专门的技能服务提供，不要直连情报后台。
skills:
  - name: news
    triggers: ["新闻", "今日头条", "热点"]
    endpoint: "http://127.0.0.1:18080/v1/skill/news"
    timeout_seconds: 10

# Agent（OpenAI 兼容 /v1/chat/completions）。密钥走环境变量，不要写进文件。
# 插件式：加一个新 LLM 只需在这里加一条（base_url + model），
# 再按需配 system_prompt（没配用默认“你是家里的语音管家……”）与
# api_key_env（读密钥的环境变量名，没配用全局 LLM_API_KEY），不改 Hub 代码。
# 云端 LLM（DeepSeek / Claude / 云端 Qwen）的 base_url 走 https 时允许公网地址；
# http 明文只许内网（密钥不能裸奔）。wake_word_routes 里配了哪个 Agent，
# 对应唤醒词就路由到哪个；没配进路由的 Agent 也可以存在（备用）。
agents:
  hermes:
    base_url: "http://hermes:8642/v1"
    model: "deepseek-chat"
    # hermes 用全局 LLM_API_KEY；system_prompt 不写就是默认管家提示词。
    system_prompt: "你是家里的语音管家，回答简短口语化，一两句话。"
  openclaw:
    base_url: "http://openclaw:18789/v1"
    model: "deepseek-chat"
  # 云端例子（默认注释掉）：取消注释 + 在 NAS 环境里 export 对应密钥
  # 再把唤醒词路由指过来即可，不用改代码。注意：只有 OpenAI 兼容
  # /v1/chat/completions 的端点能直接接进来（DeepSeek、云端 Qwen、
  # OpenRouter 这类都行）；Claude 原生 API 不是这个协议，要走一个
  # OpenAI 兼容的网关/代理才能接，不能直接填 api.anthropic.com。
  # deepseek:
  #   base_url: "https://api.deepseek.com/v1"
  #   model: "deepseek-chat"
  #   api_key_env: "DEEPSEEK_API_KEY"
  #   system_prompt: "你是家里的语音管家，回答简短口语化，一两句话。"
  # qwen-cloud:
  #   base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  #   model: "qwen-plus"
  #   api_key_env: "DASHSCOPE_API_KEY"

# 网易云：NeteaseCloudMusicApi 地址（Hub 直连，MA 已移除；扫码登录走
# Web 面板 /api/netease/*，cookie 存在 hub-data/netease-cookie.json）。
netease:
  api: "http://netease-api:3000"

# 家电实体别名表：语音只认这里配了的别名；门锁/燃气/热水器不配进来。
ha_entities:
  "客厅灯": "light.living_room"
  "卧室灯": "light.bedroom"

# Hub 自身参数
hub:
  listen: ":4399"
  tls: true
  data_dir: "./hub-data"
  stt: "localhost:10300"
  tts: "localhost:10200"
  tts_voice: "zh_CN-huayan-medium"
  snapcast: "localhost:1705"
  # MPD 地址：网易云直连播 URL、队列控制、本地曲库兜底都走 MPD；
  # MPD 跑在 host 网络，填 localhost:6600。
  mpd: "localhost:6600"
  # 点歌成功后按此切 Snapcast（P1-26）：分组 ID 见 snapserver 的 Server.GetStatus，
  # 为空表示不强制切流；流名见 deploy/snapserver.conf（NAS音乐）。
  snapcast_group: ""
  snapcast_stream: "NAS音乐"
  # 跟随播放（follow-me）：在 A 房间放音乐时去 B 房间喊唤醒词，
  # 音乐跟到 B 房间（同一首歌、同一位置；A 房间停播）。
  # 默认开启；改 false 关闭（Web 面板 PUT /api/config 也能改，立即生效）。
  follow_me: true
  # 延迟补偿（ms，P1-26）：key 为 Snapcast 客户端 ID 或显示名；两房间包起始值客厅 0 / 卧室 +15。
  snapcast_latencies:
    卧室: 15
  # P0-1：Web 面板只绑回环地址，远程管理走 SSH 隧道（不要改回 ":8080"）。
  web_listen: "127.0.0.1:8080"
  # scan_cidr 为空时自动取本机网段；本地测试可写 "127.0.0.1/32"
  # （P1-44：自动扫描已删除，scan_cidr 保留但不再被使用，
  # 设备改由 WS register 主动注册）。
  scan_cidr: ""
  # P1-44 注册制：设备在已有 WS 连接上发 register 主动注册，
  # Hub 按 discovery_fingerprints（设备证书 SHA-256 指纹白名单）
  # 校验后记为在线；白名单为空时注册一律拒绝。自动扫描已删除，
  # scan_enabled 保留但不再触发任何扫描。
  # scan_enabled: false
  # discovery_fingerprints: []
  # 勿扰时段（FR-10 主动播报跳过该时段）
  do_not_disturb: "23:00-07:00"
  # 多轮对话会话空闲超时（秒）：60 秒内没新一轮对话，会话过期清空，
  # 下次从头聊；0 表示默认 60。只在内存里记消息历史（role + 文本），
  # 不落盘，重启即清空；改后重启生效，Web 面板 /api/config 可改。
  session_timeout_seconds: 60
