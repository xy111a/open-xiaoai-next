# open-xiaoai-next MPD 配置（deploy/mpd.conf）
# 作用：MPD 读 NAS 本地音乐（/music，只读挂载），音频输出写进
# /tmp/snapfifo/snapfifo，snapserver 再分发给各房间音箱。
#
# 为什么必须有这个文件（2026-11-19 再审发现的 BLOCKER）：
# vimagick/mpd 镜像的默认配置（Alpine 包自带的 mpdconf.example）里所有
# audio_output 块都是注释掉的；没有 audio_output 时 MPD 自动找
# ALSA/OSS/Pulse——容器里没有声卡也没有 Pulse，所以找不到任何输出，
# 点歌只会进队列不出声。Hub 的 PlayURL 只做 clear/add/play，不管音频
# 往哪儿出。所以必须显式配一个 fifo 输出。
#
# 关键点（照搬已验证的三房间包 speaker-snapcast-3room/NAS/mpd.conf）：
# - format 必须和 deploy/snapserver.conf 里的 sampleformat 一致（48000:16:2）。
# - fifo 文件必须是 /tmp/snapfifo/snapfifo（目录里面的文件），不能直接
#   用 /tmp/snapfifo（那是两个容器共用的卷挂载点，一个目录）；否则 MPD
#   报 Is a directory、snapserver 的 mkfifo 也会失败。
# - /music 是只读挂载，MPD 写不进去，所以 playlist/db/log/pid/state
#   全放 /tmp（容器内可写）。
# - 本文件由 deploy/docker-compose.yml 挂到 /etc/mpd.conf，并用
#   command ["mpd", "--no-daemon", "/etc/mpd.conf"] 启动（绕开镜像
#   默认 CMD 的 /etc/mpd/mpd.conf 路径——Alpine 包默认配置在
#   /etc/mpd.conf，镜像默认 CMD 的路径未必存在）。

music_directory "/music"
playlist_directory "/tmp/mpd-playlists"
db_file "/tmp/mpd.db"
log_file "/tmp/mpd.log"
pid_file "/tmp/mpd.pid"
state_file "/tmp/mpd.state"

audio_output {
    type            "fifo"
    name            "snapfifo"
    path            "/tmp/snapfifo/snapfifo"
    format          "48000:16:2"
}
