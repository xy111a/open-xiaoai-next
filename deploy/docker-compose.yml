# open-xiaoai-next NAS 部署（部署包，2026-11-18 修订，音乐融合 B）
# 宿主：UGREEN DXP6800 Pro（UGOS + Docker），64GB 内存
# 用法：cp .env.example .env，填好 NAS_IP / HASS_TOKEN / LLM 密钥 / OPEN_XIAOAI_TOKEN，
# 再按 deploy/NAS_CHECKLIST.md 逐步操作，或跑 deploy/nas-install.sh。
# 注意：本文件仍未在真 NAS 上跑过（关口 2 BLOCKED）。2026-11-17 修掉三个必死的错：
#  1) hub 原来写 build: ../hub，但 hub/ 下没有 Dockerfile，up 会直接失败 →
#     改为 deploy/Dockerfile.hub（装预编译二进制 deploy/hub-linux-amd64）；
#  2) hub 启动强制要求环境变量 OPEN_XIAOAI_TOKEN（未设则直接退出，冒烟实测确认），
#     compose 原来没传 → 已补上；
#  3) netease-api 原来写 binarytorch/neteasecloudmusicapi，Docker Hub 查无此仓库（404）→
#     改为官方镜像 binaryify/netease_cloud_music_api（Docker Hub 页面已验证）。
# 第一次 up 出错（最可能是 UGOS Docker 路径、端口占用）请把报错贴回来。
# music_folder 是可选本地兜底：/volume1/music 不存在只警告，不阻塞启动。
# 2026-11-17 晚 P1 修复（FW-P1-1 / P1-4 / P1-37 / P1-46）：
#   - hub 传 OPEN_XIAOAI_WEB_TOKEN（Web 面板鉴权，见 .env.example）；
#   - whisper/piper/netease 只绑 127.0.0.1（Hub 走 host 网络，本机回环可达）；
#   - mosquitto 已删：Hub 代码里没有任何 MQTT 引用，它只是预留；匿名 broker 暴露 1883
#     不如删掉，需要时再加带密码配置的版本；
#   - 各服务加 TZ=Asia/Shanghai 与 deploy.resources 限额（起始值，NAS 上按实测再调）；
#   - P1-4：镜像已钉 digest（2026-11-18 从 Docker Hub manifest 接口取的 latest
#     的 Docker-Content-Digest，见各 image 行；hub 的基础镜像见 Dockerfile.hub）。
#     注意 whisper/piper/netease-api 的 digest 是 OCI index 的 digest（多架构），
#     compose 按本机架构（amd64）拉取其中对应平台的 manifest，不用改成单架构 digest。
#   - P1-4：host 网络保留——kws-sidecar 与 Hub 都走 host 网络、寻址用
#     127.0.0.1:10400，snapserver/mpd host 网络是播放链要求；改桥接要动寻址，
#     收益小于回归风险。MA 8095 已随融合 B 砍 MA 而失效，不用做。
#   - P1-4：hub 与 kws-sidecar 以 user: "1000:1000" 运行（hub 镜像内建
#     uid 1000 的 appuser，见 Dockerfile.hub；边车镜像内无该用户，用数字 uid。
#     全新 kws-data 卷的属主由边车 Dockerfile 里的 mkdir + chown 经首次
#     copy-up 带进卷（S-2，2026-11-18；该 RUN 必须在 VOLUME 声明之前）；
#     nas-install.sh §4 的 chown one-shot 只负责已存在的 root 属主旧卷
#     迁移，新卷上它是空操作）；其余 5 个服务
#     不加 user——上游镜像的数据目录是 root-owned，改 user 需逐镜像验证，
#     以 cap_drop: [ALL] 作补偿。
#   - P1-4 / SC-P2-12：7 个服务都加 cap_drop: [ALL]（失败模式是响亮的
#     启动失败，会被 nas-install.sh §5 的容器数检查捕获）。
#     read_only: true 不设——Hub 的 config 保存用 os.CreateTemp 写 /app，
#     做成需要 /app 的 tmpfs 编排且无法在无 NAS 时验证；暂缓。
#   - SC-P2-12：kws-sidecar 已有限额（512M/1.0）与 user，加固完成。
# 2026-11-18 音乐融合 B：Music Assistant 已砍（见 MUSIC_FUSION.md）——
#   - music-assistant 服务与 ma-data 卷全部删除，8095 端口不再发布、不再占用；
#   - 网易云主路改为 Hub 直连 netease-api（127.0.0.1:3000）→ MPD → Snapcast，
#     登录收进 Hub Web 面板扫码（/api/netease/*），Cookie 存 hub-data 卷；
#   - netease-api 仍只绑 127.0.0.1（只给 Hub 用）。

services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    container_name: oxn-hub
    restart: unless-stopped
    network_mode: host
    # P1-4：以 uid 1000 的 appuser 运行（镜像内已建，见 Dockerfile.hub）。
    user: "1000:1000"
    # 2026-11-23 彩排 P0-4：/volume1 是带 UGOS ACL 的 btrfs，POSIX 777 只是
    # 表象，只放行 admin 组（gid 10）；uid 1000 单独挂载读不到 /music，
    # 补 group 10 即可（NAS 实测 --group-add 10 可列出）。
    group_add:
      - "10"
    cap_drop:
      - ALL
    environment:
      - TZ=Asia/Shanghai
      - HASS_TOKEN=${HASS_TOKEN}
      - LLM_API_KEY=${LLM_API_KEY}
      - OPEN_XIAOAI_TOKEN=${OPEN_XIAOAI_TOKEN}
      # FW-P1-1：Web 面板 /api/* 的 Bearer Token，与 OPEN_XIAOAI_TOKEN 独立；
      # 未传时 Hub 以空 Token 启动，/api/* 一律 401（见 hub/internal/web/web.go）。
      - OPEN_XIAOAI_WEB_TOKEN=${OPEN_XIAOAI_WEB_TOKEN}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    volumes:
      # P1-32：去掉 :ro——Hub 运行时要写 config.yaml（语音认领房间、Web 改配置），
      # 只读挂载下 Save 必然失败。可写/种子配置分离是 P1-22/P1-23 的重构范围，不在此项。
      - ../hub/config.yaml:/app/config.yaml
      # P1-31：卷挂到 /app/hub-data——Hub 数据目录就是 ./hub-data（WORKDIR /app），
      # 原来挂 /app/data 没人用，容器重建后提醒/记忆/TLS 证书全丢。
      - hub-data:/app/hub-data
      # 2026-11-23 彩排 P0-4：音乐文件夹挂到容器内 /music（与 mpd 同一写法）；
      # 旧 compose 没这挂载，config 又写宿主机路径，本地曲库兜底全死。
      - ${MUSIC_FOLDER:-/volume1/Music}:/music:ro
    depends_on:
      # P1-4（2026-11-23 审查）：长语法 + condition: service_healthy——
      # Hub 只有在 whisper/piper/kws-sidecar 都健康后才启动，不再只等容器
      # 起来就冲（whisper 模型加载要分钟级，起来≠能用）。
      whisper:
        condition: service_healthy
      piper:
        condition: service_healthy
      kws-sidecar:
        condition: service_healthy

  # STT：FunASR Paraformer-large（2026-11-21 换模型，见 deploy/Dockerfile.whisper）：
  # NAS i5-1235U 上短命令 0.389s、CER 7.86%（Whisper small-int8 是 2.82s、16.69%，
  # 实测见 bench-20261119/funasr-bench-20261120.md）。本地构建：底座
  # rhasspy/wyoming-whisper + 一层 funasr；模型首次启动从 HF 下载约 850MB
  # 到 whisper-data 卷，是分钟级。
  # P1-4（2026-11-23 审查 + NAS 实测）：Wyoming 协议无 HTTP /health；
  # 服务端只在模型加载完、打 Ready 日志后才绑 10300 端口（NAS 实测镜像
  # 源码 __main__.py:317 先 load_transcriber()，:336-337 打 Ready 后才
  # server.run()），所以 TCP 探活即就绪探活——旧注释“5 秒内端口已通”是错的。
  # P1-4：Wyoming 协议无鉴权，只绑 127.0.0.1——Hub 走 host 网络，本机回环可达，
  # 局域网其他机器连不上。
  whisper:
    build:
      context: .
      dockerfile: Dockerfile.whisper
    container_name: oxn-whisper
    restart: unless-stopped
    cap_drop:
      - ALL
    command: --model funasr/paraformer-zh --language zh --stt-library funasr
    ports:
      - "127.0.0.1:10300:10300"
    environment:
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
    volumes:
      - whisper-data:/data
    # P1-4：TCP 探活（/usr/bin/python3 是镜像里实测的 python 路径，见
    # 2026-11-23 NAS 验证；whisper/piper 镜像里无 nc/wget/curl）。
    # start_period 600s：首次启动要下载约 850MB 模型，是分钟级。
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 10300), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 3

  # TTS：Piper，中文音色；流式合成
  # P1-4：同 whisper，只绑 127.0.0.1。
  piper:
    image: rhasspy/wyoming-piper:latest@sha256:333622ab9e4bcd00c80a37219b90a1a9d6aa3fd1ad34e0a6e3bddd36ee999efd
    container_name: oxn-piper
    restart: unless-stopped
    cap_drop:
      - ALL
    command: --voice zh_CN-huayan-medium
    ports:
      - "127.0.0.1:10200:10200"
    environment:
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    volumes:
      - piper-data:/data
    # P1-4：TCP 探活（与 whisper 同款；piper 镜像里同样只有 /usr/bin/python3，
    # 无 nc/wget/curl）。start_period 180s：音色模型小，加载是秒~分钟级。
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 10200), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3

  # KWS 边车：服务端唤醒检测（sherpa-onnx WenetSpeech，“你好小李”）。
  # 音箱只采音，Hub 解码 Opus 后把 16kHz PCM 发到 ws://127.0.0.1:10400/v1/kws。
  # 寻址（2026-11-17 统一）：边车与 Hub 一样走 network_mode: host——Hub
  # 本身就在 host 网络下，没有 compose 域名解析能力，写容器名 kws-sidecar
  # 它解析不到；host 网络下双方都直接用 127.0.0.1:10400，不依赖端口
  # 映射。边车只暴露一个端口、无需 mDNS/组播发现，host 形态与
  # hub/snapserver/mpd 一致。不要改回 ports 映射 + 容器名，否则 Hub
  # 启动时健康检查就会报“唤醒服务暂不可用”。
  # 模型不 bake 进镜像：首次启动由 entrypoint 下载到 kws-data 卷，下载失败容器报错退出。
  kws-sidecar:
    build:
      context: ../kws-sidecar
      dockerfile: Dockerfile
    container_name: oxn-kws-sidecar
    restart: unless-stopped
    network_mode: host
    # SC-P2-12 / S-2（2026-11-18 第三轮审计 P1）：以 uid 1000 运行（镜像内
    # 无该用户，用数字 uid）。全新 kws-data 卷的属主由 Dockerfile 里的
    # mkdir -p /data/kws/models && chown 1000:1000 经首次 copy-up 带进卷，
    # 不走 nas-install.sh 也能直接 `docker compose up -d kws-sidecar`
    #（冒烟项见 NAS_CHECKLIST.md §8）；已存在的 root 属主旧卷仍需
    # nas-install.sh §4 的 chown one-shot 迁移；entrypoint 在下载前另有
    # 目录可写预检，写不进时给可读 FATAL 而不是在 cp 上失败。
    # S-3：边车不启用 TLS（正式安全假设见 kws-sidecar/README.md），只绑
    # 127.0.0.1，流量不出回环；`wss://` 一配就连不上（fail-closed）。
    user: "1000:1000"
    cap_drop:
      - ALL
    environment:
      - TZ=Asia/Shanghai
      - KWS_HOST=127.0.0.1
      - KWS_PORT=10400
      - KWS_MODEL_DIR=/data/kws/models
      # SC-P1-3：边车 hello 要求 token（复用 OPEN_XIAOAI_TOKEN，与 hub 服务同一变量、
      # 同一值；未配或 <16 位时边车拒绝启动）。变量说明与强度校验见 .env.example
      # 与 nas-install.sh §0 预检查。
      - OPEN_XIAOAI_TOKEN=${OPEN_XIAOAI_TOKEN}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    volumes:
      - kws-data:/data/kws/models
      # 唤醒词以 Hub 的 config.yaml 为准：entrypoint 每次启动按它重生成
      # keywords.txt（面板改唤醒词后重启边车即生效）。只读挂载。
      - ../hub/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:10400/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # P1-37：mosquitto 已删（2026-11-17 晚）。Hub 代码里没有任何 MQTT 引用，
  # 它只是“设备注册表 + HA 发现”的预留；留着就是一个匿名 broker 占 1883。
  # 需要 MQTT 时再加回来，带显式配置 + 密码认证，不要匿名发布。

  # 多房间同步播放：Snapcast 服务端 + MPD（沿用已写的两房间包参数）
  # P1-4：host 网络保留——Snapcast 客户端（音箱）在局域网连 1704/1705，
  # MPD 经 fifo 出流；改 bridge 会断播放链。只加 TZ 与限额。
  snapserver:
    image: ivdata/snapserver:latest@sha256:20840a2b507b13e167d7e817d9f310fce7271f3abb0b4457c12804cd367509df
    container_name: oxn-snapserver
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    environment:
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    volumes:
      - ./snapserver.conf:/etc/snapserver.conf:ro
      - snapfifo:/tmp/snapfifo
    depends_on:
      - mpd

  mpd:
    image: vimagick/mpd:latest@sha256:6f8dbbb84cd6fe55d6a6eb8e6da65932f6a93000e56c230f09b15a507e127e7c
    container_name: oxn-mpd
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    environment:
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    volumes:
      # 音乐文件夹（可选本地兜底）：默认 /volume1/Music；不存在只警告，
      # 不阻塞启动（网易云直连是主路）。缺了也不用建目录。
      - ${MUSIC_FOLDER:-/volume1/Music}:/music:ro
      # MPD 配置（2026-11-19 再审补：镜像默认配置里 audio_output 全是
      # 注释，MPD 找不到输出、点歌不出声；必须显式配 fifo 输出到
      # /tmp/snapfifo/snapfifo，format 与 snapserver.conf 一致）。
      - ./mpd.conf:/etc/mpd.conf:ro
      - snapfifo:/tmp/snapfifo
      - mpd-data:/var/lib/mpd
    # 用挂载的配置启动（绕开镜像默认 CMD 的 /etc/mpd/mpd.conf 路径，
    # Alpine 包默认配置在 /etc/mpd.conf，两者不一致）。
    command: ["mpd", "--no-daemon", "/etc/mpd.conf"]

  # 网易云：只留 NeteaseCloudMusicApi（官方镜像，见 README 镜像核实表）。
  # Music Assistant 已砍（2026-11-18 融合 B）：Hub 直连本 API，
  # 登录由 Hub Web 面板扫码完成，Cookie 存 hub-data 卷；API 本身不保存登录态。
  netease-api:
    image: binaryify/netease_cloud_music_api:latest@sha256:ed9fc80e16a4813acac61f57399726a533cec402d4eb230c3adb9e023850bb03
    container_name: oxn-netease-api
    restart: unless-stopped
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    # P1-4：HTTP 探活（netease 镜像里有 /usr/bin/wget、node，无 curl；
    # 2026-11-23 NAS 实测：/ 返回 200，wget 探活形式 exit 0）。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  hub-data:
  whisper-data:
  piper-data:
  kws-data:
  snapfifo:
  mpd-data:
