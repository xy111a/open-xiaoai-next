# Snapcast 配置（沿用已写的两房间包参数，见 speaker-snapcast-3room/NAS/snapserver.conf）
# 一个流：NAS音乐，pipe:///tmp/snapfifo/snapfifo，48000:16:2
# 注意 fifo 路径是文件（/tmp/snapfifo/snapfifo），不是目录本身——挂目录本身会没声。
[server]
datadir = /tmp

[stream]
source = pipe:///tmp/snapfifo/snapfifo?name=NAS音乐&mode=create&sampleformat=48000:16:2&codec=flac
