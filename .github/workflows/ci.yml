# open-xiaoai-next CI：每个 PR 都跑。
#
# 覆盖：go test + cargo test + pytest + golangci-lint + semgrep
#   + 规则 1/2/3 的 go vet 风格检查脚本（scripts/check-*.go）。
# 注意：本仓库不在 git 远端做 main 分支保护的前提下写成；PR 触发、
# push 到 main 也跑一次，便于直接推 main 的改动同样被检查。
# 本文件在 VM 上只做过 YAML 语法检查，未在 GitHub Actions 上实跑过
# （apt 包名、Action 版本以实跑为准微调）。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go（test + vet + golangci-lint + 规则 1/2/3）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      # hub/internal/opus 用 cgo 链 libopus 与 libopusfile。
      # FW-P1-3：本机用 ~/workspace/tools/libopus 源码自编的 libopus 1.5.2 +
      # libopusfile 0.12（env.sh 设 PKG_CONFIG_PATH），CI 用 apt 的 libopus
      # 1.4.x / libopusfile 0.12：新增 cgo 系统依赖须两边同步，否则先在本机
      # 通过、再在 CI 失败；go test ./internal/opus 的往返误差断言（<10%）
      # 理论上可能因版本差在 CI 抖动。
      - name: 安装 libopus
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libopusfile-dev pkg-config
      # FW-P2-1：CI 与 lint.sh 互补——lint.sh 本地有 gofmt，CI 原来没有；
      # 本地全绿 ≠ CI 全绿就是从这里漏的。gofmt 检查 hub + scripts（与 lint.sh 同范围）。
      - name: gofmt
        run: |
          out="$(gofmt -l hub scripts)"
          if [ -n "$out" ]; then echo "gofmt 失败，以下文件格式不对：$out"; exit 1; fi
      - name: go vet
        working-directory: hub
        run: go vet ./...
      - name: go test
        working-directory: hub
        run: go test -count=1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # FW-P2-1：版本与本机一致（2026-11-18 实测本机
          # ~/workspace/tools/bin/golangci-lint v1.64.8）；升级须两边同步。
          version: v1.64.8
          working-directory: hub
          # .golangci.yml 在仓库根，golangci-lint 会向上查找。
      - name: 规则 1/2/3 检查脚本
        run: |
          go run scripts/check-wiring.go --hub hub
          go run scripts/check-nil-guards.go --hub hub
          go run scripts/check-bounds.go --hub hub

  rust:
    name: Rust（test + fmt + clippy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # P2-N7：client/rust-toolchain.toml 把工具链钉在 1.100.0；CI 必须装
      # 同一版本 + rustfmt/clippy 组件——只装 stable 时，进 client/ 目录后
      # rustup 会按 rust-toolchain.toml 切到 1.100.0，而该版本没装组件，
      # cargo fmt/clippy 会报 "not installed for the toolchain '1.100.0-...'"
      # （PR #4 首跑实测，Rust job 因此红）。换版本时这里与 rust-toolchain.toml 同步改。
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      # client 链 ALSA（alsa-sys）与 Opus。
      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev pkg-config
      # FW-P2-8：semgrep 规则 3 覆盖不到 vec![x; 变量]（无界分配）——
      # 见 scripts/check-vec-len.sh（变量长度即 FAIL，常量长度放行，
      # #[cfg(test)] 模块不查）。lint.sh 里有同款调用（run_rust）。
      # 2026-11-18 实测：生产代码无违规；aec.rs 测试里有一处
      # vec![0i16; total_samples]（total_samples 由常量派生，有界），
      # 属测试模块，不查（见 check-vec-len.sh 头注释）。
      - name: 规则 3 Rust vec! 长度检查
        run: bash scripts/check-vec-len.sh
      - name: cargo test
        working-directory: client
        run: cargo test --locked
      - name: cargo fmt --check
        working-directory: client
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: client
        run: cargo clippy --all-targets

  # 注：固件测试与边车测试曾在同一个 python job 里顺序跑，run 44063914126 里
  # 固件步骤失败后整个 job 终止，边车步骤一次都没执行、结果被掩盖。
  # 本轮拆成两个独立 job，各自结论互不掩盖。
  python-firmware:
    name: Python（固件补丁 pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 依赖真实固件材料的测试（firmware/rootfs、官方 .bin、work/ 补丁镜像）
      # 在干净 checkout 里不存在：conftest.py 会以 pytest.skip 带明确理由
      # 跳过（-rs 让理由显示在输出里），而不是 FileNotFoundError 炸掉 job；
      # 本地有材料时照常执行。固件材料不进仓库，也不让 CI 现场下载解固件。
      # 本地补跑（跳过的那 37 项在这里才真跑）：
      #   python3 -m pytest firmware-patch/tests/ -q
      # （需 speaker-open-xiaoai-rebuild/firmware/ 材料 + squashfs-tools）。
      - name: pytest
        working-directory: firmware-patch
        run: |
          python -m pip install --quiet 'pytest>=8,<9'
          python -m pytest tests/ -q -rs

  python-sidecar:
    name: Python（kws-sidecar pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # kws-sidecar 测试自给自足：CI 里没有 ~/workspace/.kws-exp，
      # tests/bootstrap.py 会下载模型（scripts/download-model.sh，
      # SHA256 已 pin）、下载 Piper 语音并生成样本；piper 与 ffmpeg
      # 是生成样本的工具依赖（见 tests/bootstrap.py）。
      - name: pytest
        working-directory: kws-sidecar
        env:
          KWS_TEST_ASSETS: /tmp/kws-test-assets
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --quiet -r requirements.txt -r requirements-dev.txt piper-tts
          python -m pytest tests/ -q

  semgrep:
    name: Semgrep（规则 3 Rust/Python / 4 / 5）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 semgrep
        run: python -m pip install --quiet 'semgrep==1.185.0'
      - name: semgrep
        run: |
          semgrep --config .semgrep/rules.yml --error \
            --exclude '*_test.go' --exclude '*/tests/*' --exclude 'test_*.py' \
            hub client/src firmware-patch/scripts

  # FW-P2-8：lint.sh 本地有 bash -n，CI 原来没有——shell 脚本语法错了
  # 本地 lint 能拦、CI 拦不住。shellcheck 未装，只跑 bash -n 语法检查。
  shell:
    name: Shell（bash -n）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          for f in firmware-patch/scripts/*.sh deploy/*.sh scripts/*.sh; do
            bash -n "$f" || exit 1
          done
          echo "bash -n 通过（shellcheck 未装，只做语法检查）"
